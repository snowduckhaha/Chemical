services:
  mysql:
    image: mysql:8.0.39
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: qidian_site
      MYSQL_USER: qidian
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      # Keep binary logs on the host-backed MySQL volume. The backup script
      # rotates and archives closed logs each day as database increments.
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --sync-binlog=1
      - --binlog-expire-logs-seconds=${MYSQL_BINLOG_RETENTION_SECONDS:-1296000}
    volumes:
      - ${MYSQL_DATA_DIR}:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - private

  backend:
    # Built on this production host from the checked-out commit.
    image: ${BACKEND_IMAGE:-qidian-site-backend:${BUILD_TAG:-local}}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    # Loopback-only exposure so the frontend SSG build (host network) can read
    # published content without exposing the backend to the public interface.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/qidian_site?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: qidian
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SITE_BASE_URL: https://${SITE_DOMAIN}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      DEPLOYMENT_CALLBACK_TOKEN: ${DEPLOYMENT_CALLBACK_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ${UPLOADS_DIR}:/app/uploads
    networks:
      - private

  frontend:
    image: ${FRONTEND_IMAGE:-qidian-site-frontend:${BUILD_TAG:-local}}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      # BuildKit cannot join compose-defined networks during a build, so the
      # build runs on the host network and reads published content from the
      # loopback-only backend exposure above. Never through the public domain.
      network: host
      args:
        SSG_API_BASE: http://127.0.0.1:8080/api/v1
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - private

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/site.conf.template:/etc/nginx/templates/site.conf.template:ro
      - ./nginx/blank.conf:/etc/nginx/conf.d/default.conf:ro
      - ${UPLOADS_DIR}:/srv/uploads:ro
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    depends_on:
      - frontend
      - backend
    networks:
      - private

networks:
  private:
    name: qidian_private
    driver: bridge
