services:
  mysql:
    image: mysql:8.0.39
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: qidian_site
      MYSQL_USER: qidian
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ${MYSQL_DATA_DIR}:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - private

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/qidian_site?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: qidian
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SITE_BASE_URL: https://${SITE_DOMAIN}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ${UPLOADS_DIR}:/app/uploads
    networks:
      - private

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - private

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/site.conf.template:/etc/nginx/templates/site.conf.template:ro
      - ${UPLOADS_DIR}:/srv/uploads:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    depends_on:
      - frontend
      - backend
    networks:
      - private

networks:
  private:
    driver: bridge
