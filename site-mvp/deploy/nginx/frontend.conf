server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Emit relative redirects only. This nginx listens on 8080 behind the
    # gateway, so absolute redirects would leak the internal port (and the
    # wrong scheme) into public Location headers such as /zh -> /zh/.
    absolute_redirect off;

    # Dynamic infrastructure remains backend-owned so sitemap changes do not
    # require rebuilding the static release.
    location = /sitemap.xml {
        proxy_pass http://backend:8080;
        add_header Cache-Control "public, max-age=900" always;
    }

    location = /robots.txt {
        proxy_pass http://backend:8080;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Admin routes intentionally share a small SPA shell.  Public routes must
    # never fall back to this file: unknown public URLs are genuine 404s.
    location ~ ^/(zh|en)/admin/ {
        try_files /admin-shell.html =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "private, no-store" always;
    }

    # A page that was published after the most recent Vite-SSG build has no
    # corresponding .html file yet.  Confirm that the requested article is
    # publicly available through the backend, then use the language-specific
    # news shell so Vue can load the current content immediately.  This keeps
    # genuine missing, offline, or future-dated article URLs as HTTP 404s.
    # The next normal frontend build still emits a fully pre-rendered page.
    location ~ ^/(?<lang>zh|en)/news/(?<categorySlug>[a-z0-9][a-z0-9-]*)/(?<articleSlug>[a-z0-9][a-z0-9-]*)$ {
        try_files $uri $uri.html @news_detail_shell;
    }

    location @news_detail_shell {
        internal;
        auth_request /__verify_news_detail?lang=$lang&category=$categorySlug&article=$articleSlug;
        # auth_request converts a denied subrequest (including the backend's
        # 404) into 500.  Turn that result back into the correct public 404.
        error_page 500 = /__public_page_not_found;
        try_files /$lang/news.html =404;
    }

    location = /__verify_news_detail {
        internal;
        proxy_pass http://backend:8080/api/v1/news/$arg_category/$arg_article?lang=$arg_lang;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /__public_page_not_found {
        internal;
        return 404;
    }

    # Trailing-slash URLs whose directory has no index.html fall back to the
    # sibling .html page emitted by vite-ssg (/zh/products/ -> /zh/products.html),
    # instead of ending in 403 from directory listing denial.
    location ~ ^/(.+)/$ {
        try_files /$1/index.html /$1.html =404;
    }

    location / {
        # $uri.html must precede $uri/: the home pages ship as root-level
        # zh.html / en.html while zh/ and en/ directories hold sub-pages.
        # Directory-first ordering would 301 to /zh/ and end in 403.
        try_files $uri $uri.html $uri/ =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Home banner images are updated frequently without filename hashing;
    # use short cache to avoid stale content after deployments.
    location /home/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # About page banner also updated without filename hashing.
    location /about/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # The company introduction video is content-addressed by filename and
    # never changes in place; cache it aggressively at the CDN edge.
    location ~* \.mp4$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
