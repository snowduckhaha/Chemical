server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dynamic infrastructure remains backend-owned so sitemap changes do not
    # require rebuilding the static release.
    location = /sitemap.xml {
        proxy_pass http://backend:8080;
        add_header Cache-Control "public, max-age=900" always;
    }

    location = /robots.txt {
        proxy_pass http://backend:8080;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Admin routes intentionally share a small SPA shell.  Public routes must
    # never fall back to this file: unknown public URLs are genuine 404s.
    location ~ ^/(zh|en)/admin/ {
        try_files /admin-shell.html =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Home banner images are updated frequently without filename hashing;
    # use short cache to avoid stale content after deployments.
    location /home/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # About page banner also updated without filename hashing.
    location /about/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
