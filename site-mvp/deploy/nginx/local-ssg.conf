server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Vite-SSG writes /zh as zh.html and /zh/products/x as zh/products/x.html.
    # A missing public URL must remain a 404 instead of falling back to the SPA.
    location / {
        try_files $uri.html $uri $uri/ =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SSG pages hydrate in the browser and continue to read data from the
    # local Spring API. Keep the browser origin on :5175 while forwarding
    # these requests to the host service exposed on :8081.
    location /api/ {
        proxy_pass http://host.docker.internal:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded CMS assets and SEO discovery documents are also served by the
    # API in local development, rather than being part of the static bundle.
    location /uploads/ {
        proxy_pass http://host.docker.internal:8081;
        proxy_set_header Host $host;
    }

    location = /sitemap.xml {
        proxy_pass http://host.docker.internal:8081;
        proxy_set_header Host $host;
    }

    location = /robots.txt {
        proxy_pass http://host.docker.internal:8081;
        proxy_set_header Host $host;
    }
}
